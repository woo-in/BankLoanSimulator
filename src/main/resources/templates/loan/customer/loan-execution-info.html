<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>대출 실행 정보 입력 - 우인은행</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

    .page-title { font-size: 24px; font-weight: 800; margin-bottom: 30px; text-align: center; }

    .form-group { margin-bottom: 25px; }
    .form-label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 15px; color: #333; }
    .form-select, .form-input { width: 100%; padding: 12px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
    .form-text { font-size: 13px; color: #666; margin-top: 6px; }

    .btn-submit { width: 100%; padding: 15px; background-color: #1570ef; color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 20px; }
    .btn-submit:hover { background-color: #175cd3; }
  </style>
</head>
<body>

<div class="container">
  <h1 class="page-title">대출 실행 정보 입력</h1>

  <form th:action="@{/management/loan/loan-applications/{id}/contract/execution-info(id=${loanApplication.loanApplicationId})}"
        th:object="${executionRequest}" method="post">

    <div class="form-group">
      <label class="form-label">대출금 입금 계좌</label>
      <select th:field="*{disbursementAccountId}" class="form-select" required>
        <option value="">계좌를 선택하세요</option>
        <option th:each="acc : ${availableAccounts}"
                th:value="${acc.accountId}"
                th:text="|${acc.nickname} (${acc.accountNumber}) - 잔액 ${#numbers.formatInteger(acc.balance, 0, 'COMMA')}원|">
        </option>
      </select>
      <div class="form-text">대출 실행 후 해당 계좌로 입금됩니다.</div>
    </div>

    <div class="form-group">
      <label class="form-label">자동이체 출금 계좌 (이자 납입)</label>
      <select th:field="*{repaymentAccountId}" class="form-select" required>
        <option value="">계좌를 선택하세요</option>
        <option th:each="acc : ${availableAccounts}"
                th:value="${acc.accountId}"
                th:text="|${acc.nickname} (${acc.accountNumber})|">
        </option>
      </select>
      <div class="form-text">매월 정해진 날짜에 이자가 자동 출금됩니다.</div>
    </div>

    <div class="form-group">
      <label class="form-label">매월 결제일 (이자 납입일)</label>
      <select th:field="*{paymentDay}" class="form-select" required>
        <option value="">날짜를 선택하세요</option>
        <option value="5">매월 5일</option>
        <option value="10">매월 10일 (월급날 추천)</option>
        <option value="21">매월 21일</option>
        <option value="25">매월 25일 (월급날 추천)</option>
        <option value="28">매월 28일</option>
      </select>
      <div class="form-text">선택하신 날짜에 첫 이자가 청구됩니다.</div>
    </div>

    <button type="submit" class="btn-submit">확인 및 전자 서명</button>
  </form>
</div>

</body>
</html>
