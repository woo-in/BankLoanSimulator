<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>대출 신청 상세 - 우인은행</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

    /* 헤더 */
    .header { margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
    .back-link { text-decoration: none; color: #666; font-size: 14px; font-weight: 600; display: inline-block; margin-bottom: 10px; }
    .back-link:hover { color: #333; text-decoration: underline; }
    .title-row { display: flex; justify-content: space-between; align-items: center; }
    .page-title { font-size: 24px; font-weight: 800; color: #101828; margin: 0; }

    /* 상태 배지 */
    .status-badge { padding: 8px 16px; border-radius: 24px; font-weight: 700; font-size: 14px; }
    .status-APPLIED { background-color: #e3f2fd; color: #1976d2; }
    .status-APPROVED { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .status-REJECTED { background-color: #ffebee; color: #c62828; }
    .status-UNKNOWN { background-color: #f2f4f7; color: #666; }

    /* 안내 박스 */
    .info-box { background-color: #f8f9fa; border-radius: 12px; padding: 25px; text-align: center; margin-bottom: 30px; border: 1px solid #eee; }
    .info-icon { font-size: 40px; margin-bottom: 15px; display: block; }
    .info-title { font-size: 18px; font-weight: 700; color: #333; margin-bottom: 10px; }
    .info-desc { font-size: 14px; color: #666; line-height: 1.6; }

    /* 상세 테이블 */
    .detail-table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid #eaecf0; border-radius: 12px; overflow: hidden; margin-bottom: 30px; }
    .detail-table th, .detail-table td { padding: 15px 20px; text-align: left; border-bottom: 1px solid #eaecf0; }
    .detail-table th { background-color: #f9fafb; font-weight: 600; color: #475467; font-size: 14px; width: 30%; }
    .detail-table td { font-size: 15px; color: #101828; }
    .detail-table tr:last-child th, .detail-table tr:last-child td { border-bottom: none; }

    /* 버튼 */
    .action-bar { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn { padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; border: none; text-decoration: none; transition: all 0.2s; }
    .btn-list { background-color: #f2f4f7; color: #344054; }
    .btn-list:hover { background-color: #e4e7ec; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">

    <div class="title-row">
      <div>
        <h1 class="page-title" th:text="${loanApplication.loanProductName}">신용대출</h1>
        <span style="font-size: 14px; color: #666;" th:text="${loanApplication.loanProductType}">개인신용</span>
      </div>

      <span class="status-badge"
            th:classappend="${loanApplication.applicationStatus} ? 'status-' + ${loanApplication.applicationStatus} : 'status-UNKNOWN'"
            th:text="${loanApplication.applicationStatus?.description} ?: '상태 미정'">
                심사 대기
            </span>
    </div>
  </div>

  <div class="info-box">
    <span class="info-icon">⏳</span>
    <div class="info-title">현재 심사가 진행 중입니다</div>
    <div class="info-desc">
      고객님이 제출하신 서류와 정보를 바탕으로 심사를 진행하고 있습니다.<br>
      결과는 영업일 기준 1~3일 내에 확정되며, 완료 시 알림을 보내드립니다.
    </div>
  </div>

  <h3 style="font-size: 18px; margin-bottom: 15px;">신청하신 대출 정보</h3>
  <table class="detail-table">
    <tr>
      <th>신청 금액</th>
      <td th:text="${loanApplication.appliedLoanAmount != null} ? ${#numbers.formatInteger(loanApplication.appliedLoanAmount, 0, 'COMMA')} + ' 원' : '-'">50,000,000 원</td>
    </tr>
    <tr>
      <th>대출 기간</th>
      <td th:text="${loanApplication.appliedLoanTerm} + ' 개월'">24 개월</td>
    </tr>
    <tr>
      <th>상환 방식</th>
      <td th:text="${loanApplication.repaymentMethodName}">원리금균등</td>
    </tr>
    <tr>
      <th>금리 유형</th>
      <td th:text="${loanApplication.interestRateTypeName}">고정금리</td>
    </tr>
    <tr>
      <th>신청 일시</th>
      <td th:text="${#temporals.format(loanApplication.createdAt, 'yyyy-MM-dd HH:mm')}">2023-01-01 12:00</td>
    </tr>
  </table>

  <div class="action-bar">
    <a href="/management/loan/loan-applications" class="btn btn-list">목록으로 돌아가기</a>
  </div>

</div>

</body>
</html>
