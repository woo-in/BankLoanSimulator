<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>우인은행 - 대출 신청 내역</title>
    <style>
        /* --- 공통 스타일 (management-home.html 기반) --- */
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        /* 헤더 스타일 */
        .header {
            padding: 10px 0;
            margin-bottom: 20px;
            background-color: #f0f2f5;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo { display: flex; align-items: center; text-decoration: none; color: inherit; }
        .logo-shape-container { position: relative; width: 35px; height: 25px; margin-right: 10px; }
        .circle-1, .circle-2 { position: absolute; width: 25px; height: 25px; border-radius: 50%; }
        .circle-1 { background-color: #4a90e2; top: 0; left: 0; }
        .circle-2 { background-color: #74ebd5; opacity: 0.8; top: 0; right: 0; }
        .logo-text { font-size: 24px; font-weight: bold; color: #333; }

        .right-section { display: flex; align-items: center; gap: 15px; }
        .user-name { font-size: 14px; font-weight: 600; color: #555; }
        .logout-button { background: none; border: none; color: #555; font-weight: bold; font-size: 14px; cursor: pointer; padding: 8px; transition: color 0.2s; }
        .logout-button:hover { color: #000; }

        .main-nav { display: flex; justify-content: space-between; align-items: center; }
        .nav-tabs { display: flex; gap: 20px; }
        .nav-item { font-size: 22px; font-weight: bold; color: #888; text-decoration: none; padding-bottom: 10px; border-bottom: 3px solid transparent; transition: color 0.2s; }
        .nav-item:hover { color: #333; }
        .nav-item.active { color: #333; border-bottom-color: #4a90e2; }

        /* --- 테이블 및 컨텐츠 스타일 --- */
        .content-container {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            min-height: 500px;
        }

        .page-title { font-size: 24px; font-weight: bold; color: #333; margin-bottom: 25px; }

        /* 테이블 스타일 */
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 18px 15px; text-align: left; border-bottom: 1px solid #eee; font-size: 15px; }
        th { color: #666; font-weight: 600; background-color: #fafafa; border-bottom: 2px solid #eee; }

        /* 행 클릭 효과 (활성 상태일 때만) */
        tr.clickable-row { cursor: pointer; transition: background-color 0.2s; }
        tr.clickable-row:hover { background-color: #f8f9fa; }

        /* 비활성 행 스타일 (계약완료/취소) */
        tr.disabled-row { background-color: #fafafa; color: #aaa; cursor: default; }
        tr.disabled-row .product-name { color: #aaa; }
        tr.disabled-row .rate-text { color: #aaa; }
        tr.disabled-row .status-badge { opacity: 0.7; }

        /* 텍스트 스타일 */
        .product-name { font-weight: bold; color: #333; font-size: 16px; }
        .sub-text { font-size: 13px; color: #888; margin-top: 4px; }
        .date-text { color: #666; font-size: 14px; }

        /* 상태 배지 */
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; text-align: center; min-width: 80px;}

        /* 상태별 색상 (Enum 이름과 매칭) */
        .status-APPLIED { background-color: #e3f2fd; color: #1976d2; }     /* 심사중 (파랑) */
        .status-APPROVED { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9;} /* 승인 (초록) */
        .status-REJECTED { background-color: #ffebee; color: #c62828; }     /* 거절 (빨강) */
        .status-CONTRACTED { background-color: #f3e5f5; color: #7b1fa2; }   /* 약정완료 (보라) */
        .status-CANCELED { background-color: #f5f5f5; color: #666; }        /* 취소 (회색) */

        .empty-message { text-align: center; padding: 50px 0; color: #999; font-size: 16px; }

        .back-link { display: inline-block; margin-bottom: 20px; color: #666; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #333; text-decoration: underline; }

    </style>
</head>
<body>

<header class="header">
    <div class="header-top">
        <a href="/" class="logo">
            <div class="logo-shape-container">
                <div class="circle-1"></div>
                <div class="circle-2"></div>
            </div>
            <div class="logo-text">우인은행</div>
        </a>

        <div class="right-section">
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="logout-button">로그아웃</button>
            </form>
        </div>
    </div>

    <nav class="main-nav">
        <div class="nav-tabs">
            <a href="/" class="nav-item">통장</a>
            <a href="/management" class="nav-item active">관리</a>
            <a href="/product" class="nav-item">상품찾기</a>
            <a href="/feature" class="nav-item">서비스</a>
        </div>
    </nav>
</header>

<main>
    <section class="content-container">
        <h2 class="page-title">나의 대출 신청 내역</h2>

        <table>
            <thead>
            <tr>
                <th style="width: 20%">신청일</th>
                <th style="width: 40%">상품명</th>
                <th style="width: 20%">상품 종류</th>
                <th style="width: 20%; text-align: center;">상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(briefAppliedLoanApplicationResponses)}">
                <td colspan="4" class="empty-message"> 신청하신 대출 내역이 없습니다.<br>
                    <a href="/product" style="color:#4a90e2; font-weight:bold; text-decoration:none; display:inline-block; margin-top:10px;">대출 상품 보러가기 ></a>
                </td>
            </tr>

            <tr th:each="app : ${briefAppliedLoanApplicationResponses}"
                th:classappend="${app.applicationStatus.name() == 'CONTRACTED' or app.applicationStatus.name() == 'CANCELED'} ? 'disabled-row' : 'clickable-row'"
                th:onclick="${app.applicationStatus.name() == 'CONTRACTED' or app.applicationStatus.name() == 'CANCELED'} ? null : |location.href='@{/management/loan/loan-applications/{id}(id=${app.loanApplicationId})}'|">

                <td class="date-text" th:text="${#temporals.format(app.createdAt, 'yyyy.MM.dd')}">2023.01.01</td>

                <td>
                    <div class="product-name" th:text="${app.loanProductName}">직장인 신용대출</div>
                    <div class="sub-text" th:text="'신청번호 #' + ${app.loanApplicationId}">신청번호 #1001</div>
                </td>

                <td th:text="${app.loanProductType}">신용대출</td>

                <td style="text-align: center;">
                     <span class="status-badge"
                           th:classappend="'status-' + ${app.applicationStatus}"
                           th:text="${app.applicationStatus.description}">
                        심사중
                    </span>
                    <div th:if="${app.applicationStatus.name() == 'APPROVED'}"
                         style="font-size: 11px; color: #2e7d32; margin-top: 5px; font-weight: 600;">
                        계약 가능
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

</body>
</html>
