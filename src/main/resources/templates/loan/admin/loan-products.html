<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>우인은행 - 대출 상품 관리</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 0;
    }

    /* --- Header Style --- */
    .header {
      padding: 15px 20px;
      background-color: white;
      border-bottom: 1px solid #e1e5ea;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo-area {
      display: flex;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    .logo-shape {
      display: inline-block;
      width: 12px;
      height: 12px;
      background-color: #4a90e2;
      border-radius: 50%;
      margin-right: 8px;
      position: relative;
    }
    .logo-shape::after {
      content: '';
      position: absolute;
      left: 8px;
      width: 12px;
      height: 12px;
      background-color: #74ebd5;
      border-radius: 50%;
      opacity: 0.7;
    }

    .admin-badge {
      background-color: #333;
      color: white;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
      margin-left: 8px;
      vertical-align: middle;
    }

    /* --- Layout --- */
    .main-container {
      max-width: 1600px; /* 상품 관리는 테이블이 넓어서 폭을 키움 */
      margin: 30px auto;
      padding: 0 20px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: #666;
      font-weight: 600;
      margin-bottom: 20px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #4a90e2; }
    .back-icon { margin-right: 5px; font-size: 18px; }

    .content-grid {
      display: grid;
      grid-template-columns: 450px 1fr; /* 입력 폼 너비 확보 */
      gap: 25px;
      align-items: start;
    }
    @media (max-width: 1100px) {
      .content-grid { grid-template-columns: 1fr; }
    }

    .card {
      background-color: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin: 0 0 20px 0;
      padding-bottom: 15px;
      border-bottom: 1px solid #f0f0f0;
    }

    /* --- Form --- */
    .form-group { margin-bottom: 15px; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      box-sizing: border-box;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: #4a90e2;
    }
    .form-textarea { resize: vertical; min-height: 60px; }

    /* 그룹 박스 (Fieldset) 스타일 */
    .form-fieldset {
      border: 1px solid #eef1f7;
      background-color: #fcfcfc;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .form-legend {
      font-size: 13px;
      font-weight: 700;
      color: #4a90e2;
      padding: 0 5px;
      width: auto;
      border-bottom: none;
      margin-bottom: 0;
    }
    .fieldset-row {
      display: flex;
      gap: 10px;
    }
    .fieldset-row > div { flex: 1; }

    /* 체크박스 그룹 */
    .checkbox-group-container {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      background-color: white;
      max-height: 120px;
      overflow-y: auto;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }
    .checkbox-item:last-child { margin-bottom: 0; }
    .checkbox-item input {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      accent-color: #4a90e2;
      cursor: pointer;
    }
    .checkbox-item label {
      font-size: 13px;
      color: #333;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }
    .submit-btn:hover { background-color: #357ABD; }

    /* --- Table --- */
    .custom-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .custom-table th {
      text-align: left;
      padding: 12px 15px;
      background-color: #f8f9fa;
      color: #666;
      font-weight: 600;
      border-bottom: 2px solid #eef1f7;
      white-space: nowrap;
    }
    .custom-table td {
      padding: 12px 15px;
      border-bottom: 1px solid #f0f0f0;
      color: #333;
      vertical-align: top;
    }
    .custom-table tr:last-child td { border-bottom: none; }

    .product-name { font-weight: bold; font-size: 14px; display: block; margin-bottom: 2px; }
    .product-type { font-size: 11px; color: #888; background-color: #f0f0f0; padding: 2px 6px; border-radius: 4px; }

    .slug-text { font-family: monospace; color: #555; background: #f9f9f9; padding: 2px 4px; border-radius: 4px;}

    .info-block small { color: #888; font-size: 11px; display: block; margin-bottom: 2px; }
    .info-divider { margin: 8px 0; border: 0; border-top: 1px dashed #eee; }

    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-active { background-color: #e6f7ff; color: #0085cc; }
    .status-inactive { background-color: #fff1f0; color: #cf1322; }
    .empty-state { text-align: center; padding: 40px; color: #999; }

    .input-error {
      border-color: #ff4d4f !important;
      background-color: #fff1f0;
    }
    .error-msg {
      color: #ff4d4f;
      font-size: 12px;
      margin-top: 4px;
    }

  </style>
</head>
<body>

<header class="header">
  <div class="logo-area">
    <span class="logo-shape"></span>
    우인은행 <span class="admin-badge">ADMIN</span>
  </div>
</header>

<main class="main-container">

  <a th:href="@{/admin/loan}" class="back-link">
    <span class="back-icon">←</span> 관리자 홈으로
  </a>

  <div class="content-grid">

    <section class="card">
      <h2 class="card-title">신규 대출 상품 등록</h2>

      <form th:action="@{/admin/loan/loan-products}" th:object="${newLoanProduct}" method="POST">

        <div class="form-group">
          <label for="loanProductName" class="form-label">상품명</label>
          <input type="text" id="loanProductName" th:field="*{loanProductName}" class="form-input" placeholder="예: 직장인 신용대출" required>
        </div>

        <div class="form-group">
          <label for="loanProductSlug" class="form-label">Slug (URL 키워드)</label>
          <input type="text" id="loanProductSlug" th:field="*{loanProductSlug}"
                 class="form-input"
                 th:classappend="${#fields.hasErrors('loanProductSlug')} ? 'input-error' : ''"
                 placeholder="예: office-credit-loan">
          <div class="error-msg" th:if="${#fields.hasErrors('loanProductSlug')}" th:errors="*{loanProductSlug}">Slug 중복 오류</div>
        </div>

        <div class="form-group">
          <label for="loanProductDescription" class="form-label">상품 설명</label>
          <textarea id="loanProductDescription" th:field="*{loanProductDescription}" class="form-textarea" placeholder="상품에 대한 간단한 설명"></textarea>
        </div>

        <div class="fieldset-row">
          <div class="form-group">
            <label for="loanType" class="form-label">대출 유형</label>
            <select id="loanType" th:field="*{loanType}" class="form-select" required>
              <option value="CREDIT">신용대출</option>
              <option value="MORTGAGE">담보대출</option>
            </select>
          </div>
          <div class="form-group">
            <label for="status" class="form-label">상태</label>
            <select id="status" th:field="*{status}" class="form-select" required>
              <option value="ACTIVE">활성</option>
              <option value="INACTIVE">비활성</option>
            </select>
          </div>
        </div>

        <fieldset class="form-fieldset">
          <legend class="form-legend">대출 한도 (원)</legend>
          <div class="fieldset-row">
            <div>
              <label class="form-label">최소</label>
              <input type="number" th:field="*{minLoanAmount}"
                     class="form-input"
                     th:classappend="${#fields.hasErrors('minLoanAmount')} ? 'input-error' : ''"
                     placeholder="0" min="0">
              <div class="error-msg" th:if="${#fields.hasErrors('minLoanAmount')}" th:errors="*{minLoanAmount}">금액 오류</div>
            </div>
            <div>
              <label class="form-label">최대</label>
              <input type="number" th:field="*{maxLoanAmount}" class="form-input" placeholder="0" min="0">
            </div>
          </div>
          <div style="margin-top: 10px;">
            <label class="form-label">신청 단위</label>
            <input type="number" th:field="*{applicationAmountUnit}" class="form-input" placeholder="예: 100000" min="1">
          </div>
        </fieldset>

        <fieldset class="form-fieldset">
          <legend class="form-legend">대출 기간 (개월)</legend>
          <div class="fieldset-row">
            <div>
              <label class="form-label">최소</label>
              <input type="number" th:field="*{minLoanTerm}" class="form-input" placeholder="12">
            </div>
            <div>
              <label class="form-label">최대</label>
              <input type="number" th:field="*{maxLoanTerm}" class="form-input" placeholder="60">
            </div>
          </div>
          <div style="margin-top: 10px;">
            <label class="form-label">신청 단위</label>
            <input type="number" th:field="*{applicationTermUnit}" class="form-input" placeholder="예: 12">
          </div>
        </fieldset>

        <div class="form-group">
          <label for="defaultSpread" class="form-label">기본 가산금리 (%)</label>
          <input type="number" id="defaultSpread" th:field="*{defaultSpread}" class="form-input" step="0.01" placeholder="3.5">
        </div>

        <div class="form-group">
          <label class="form-label">금리 유형 옵션</label>
          <div class="checkbox-group-container">
            <div th:each="type : ${interestTypeInfoResponses}" class="checkbox-item">
              <input type="checkbox" th:id="'rate-' + ${type.interestRateTypeId}" th:field="*{interestRateTypeIds}" th:value="${type.interestRateTypeId}">
              <label th:for="'rate-' + ${type.interestRateTypeId}" th:text="${type.typeName}"></label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">상환 방법 옵션</label>
          <div class="checkbox-group-container">
            <div th:each="method : ${repaymentMethodInfoResponses}" class="checkbox-item">
              <input type="checkbox" th:id="'repay-' + ${method.repaymentMethodId}" th:field="*{repaymentMethodIds}" th:value="${method.repaymentMethodId}">
              <label th:for="'repay-' + ${method.repaymentMethodId}" th:text="${method.methodName}"></label>
            </div>
          </div>
        </div>

        <button type="submit" class="submit-btn">상품 등록하기</button>
      </form>
    </section>

    <section class="card">
      <h2 class="card-title">등록된 대출 상품 목록</h2>

      <div th:if="${#lists.isEmpty(loanProductInfoResponses)}" class="empty-state">
        등록된 대출 상품이 없습니다.
      </div>

      <table class="custom-table" th:unless="${#lists.isEmpty(loanProductInfoResponses)}">
        <thead>
        <tr>
          <th>상품정보</th>
          <th>한도 설정</th>
          <th>기간 설정</th>
          <th>금리/상태</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${loanProductInfoResponses}">
          <td>
            <span class="product-name" th:text="${product.loanProductName}">직장인대출</span>
            <span class="product-type" th:text="${product.loanType}">CREDIT</span>
            <div style="margin-top: 5px;">
              <span class="slug-text" th:text="${product.loanProductSlug}">slug</span>
            </div>
          </td>

          <td class="info-block">
            <small>최소 ~ 최대</small>
            <span th:text="${#numbers.formatInteger(product.minLoanAmount, 1, 'COMMA')}">1,000,000</span> ~
            <span th:text="${#numbers.formatInteger(product.maxLoanAmount, 1, 'COMMA')}">100,000,000</span>
            <div class="info-divider"></div>
            <small>단위</small>
            <span th:text="${#numbers.formatInteger(product.applicationAmountUnit, 1, 'COMMA')}">100,000</span>원
          </td>

          <td class="info-block">
            <small>최소 ~ 최대</small>
            <span th:text="${product.minLoanTerm}">12</span> ~ <span th:text="${product.maxLoanTerm}">60</span>개월
            <div class="info-divider"></div>
            <small>단위</small>
            <span th:text="${product.applicationTermUnit}">12</span>개월
          </td>

          <td>
            <div style="margin-bottom: 8px;">
              <span style="font-weight: bold; color: #333;" th:text="${product.defaultSpread} + '%'">3.5%</span>
              <small style="color: #888;">(가산)</small>
            </div>
            <span class="status-badge"
                  th:classappend="${product.status == T(bankapp.loan.product.model.ProductStatus).ACTIVE} ? 'status-active' : 'status-inactive'"
                  th:text="${product.status}">
                            ACTIVE
                        </span>
          </td>
        </tr>
        </tbody>
      </table>
    </section>

  </div>
</main>

</body>
</html>
