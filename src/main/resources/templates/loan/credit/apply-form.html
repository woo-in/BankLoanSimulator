<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>우인은행 - 대출 신청하기</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    .simple-header {
      display: flex;
      align-items: center;
      padding: 10px 0;
      margin-bottom: 20px;
      background-color: #f0f2f5;
      position: sticky;
      top: 0;
      border-bottom: 1px solid #e0e0e0;
    }
    .back-button {
      font-size: 28px;
      font-weight: bold;
      color: #333;
      text-decoration: none;
      margin-right: 15px;
      padding: 0 10px;
    }
    .form-card {
      background-color: white;
      padding: 35px 40px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 700px;
      margin: 0 auto;
    }

    /* --- 폼 상단의 정보 요약 --- */
    .info-summary {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #f0f2f5;
      padding-bottom: 25px;
    }
    .info-summary-product-name {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin: 0;
    }
    .info-summary-rate-box {
      background-color: #f7f9fc;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      display: inline-block;
    }
    .info-summary-rate-label {
      font-size: 15px;
      color: #555;
      margin: 0;
    }
    .info-summary-rate-value {
      font-size: 28px;
      font-weight: bold;
      color: #4a90e2;
      margin: 5px 0 0 0;
    }

    /* --- 폼 그룹 스타일 --- */
    .form-group { margin-bottom: 25px; }
    .form-group label {
      display: block;
      font-size: 16px;
      font-weight: bold;
      color: #555;
      margin-bottom: 10px;
    }
    .form-group select {
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 10px;
      background-color: #f9f9f9;
      box-sizing: border-box;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D'20'%20height%3D'20'%20fill%3D'%23555'%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%3E%3Cpath%20d%3D'M7.41% 8.59L12% 2013.17l4.59-4.58L18% 2010l-6% 206-6-6% 201.41-1.41z'%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 15px center;
      background-size: 20px;
      cursor: pointer;
    }

    /* ... (기타 스타일) ... */

    /* --- 동의/제출 버튼 --- */
    .agreement-section {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 40px;
      margin-bottom: 25px;
    }
    .agreement-section input[type="checkbox"] { margin-right: 10px; }
    .agreement-section label { font-size: 15px; color: #666; }
    .action-button-container { text-align: center; margin-top: 20px; }
    .action-button {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background-color: #E64A19; /* '신청하기' 강조 색상 */
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .action-button:disabled { background-color: #f3a995; cursor: not-allowed; }
  </style>
</head>
<body>

<header class="simple-header">
  <a th:href="@{'/loan/credit/' + ${formSetup.loanProductSlug} + '/calculate'}" class="back-button">&lt;</a>
</header>

<main>
  <section class="form-card">

    <div class="info-summary">
      <h1 class="info-summary-product-name" th:text="${formSetup.loanProductName}">상품명</h1>
      <div class="info-summary-rate-box">
        <p class="info-summary-rate-label">고객님 예상 금리</p>
        <p class="info-summary-rate-value" th:text="${#numbers.formatDecimal(formSetup.finalInterestRate, 1, 2)} + '%'">5.25%</p>
      </div>
    </div>

    <form id="loan-apply-form"
          th:action="@{'/loan/credit/' + ${formSetup.loanProductSlug} + '/apply'}"
          th:object="${newApplicationRequest}"
          method="post">

      <div class="form-group">
        <label for="loan-amount">대출 신청금액 (원)</label>
        <select id="loan-amount" th:field="*{loanAmount}" required>
          <option value="">-- 금액 선택 --</option>
          <option th:each="amount : ${formSetup.availableAmounts}"
                  th:value="${amount}"
                  th:text="${#numbers.formatCurrency(amount)} + '원'"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="loan-term">대출기간 (개월)</label>
        <select id="loan-term" th:field="*{loanTerm}" required>
          <option value="">-- 기간 선택 --</option>
          <option th:each="term : ${formSetup.availableTerms}"
                  th:value="${term}"
                  th:text="${term} + '개월'"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="repayment-method">상환방법</label>
        <select id="repayment-method" th:field="*{repaymentMethodId}" required>
          <option value="">-- 상환방법 선택 --</option>
          <option th:each="option : ${formSetup.repaymentOptions}"
                  th:value="${option.id}"
                  th:text="${option.name}"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="interest-rate-type">금리종류</label>
        <select id="interest-rate-type" th:field="*{interestRateTypeId}" required>
          <option value="">-- 금리종류 선택 --</option>
          <option th:each="option : ${formSetup.interestRateTypeOptions}"
                  th:value="${option.id}"
                  th:text="${option.name}"></option>
        </select>
      </div>

      <div class="agreement-section">
        <input type="checkbox" id="privacy-agree">
        <label for="privacy-agree">대출 신청 약관 및 개인정보 처리에 동의합니다.</label>
      </div>

      <div class="action-button-container">
        <button type="submit" id="submit-button" class="action-button" disabled>
          최종 대출 신청하기
        </button>
      </div>

    </form>
  </section>
</main>

<script>
  const agreeCheckbox = document.getElementById('privacy-agree');
  const submitButton = document.getElementById('submit-button');
  agreeCheckbox.addEventListener('change', function() {
    submitButton.disabled = !this.checked;
  });
</script>

</body>
</html>
